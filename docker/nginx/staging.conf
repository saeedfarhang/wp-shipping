server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.php;

    client_max_body_size 64m;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(\.env|\.git|\.gitignore|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock) {
        deny all;
    }

    location ~* \.(sql|sql\.gz|tar|tar\.gz|tgz|zip|bak|orig|log|swp)$ {
        deny all;
    }

    location ~* /wp-config\.php$ {
        deny all;
    }

    location ~* /(?:wp-content/uploads|wp-content/blogs.dir)/.*\.php$ {
        deny all;
    }

    location ~* /(?:readme|license|changelog)\.(?:html|md|txt)$ {
        deny all;
    }

    location = /xmlrpc.php {
        deny all;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|avif|svg|ico|woff|woff2|ttf|eot|otf|mp4|wasm|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_fastcgi wordpress-stage:9000;
        fastcgi_pass $php_fastcgi;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_connect_timeout 10s;
    }

    location ~ /\.ht {
        deny all;
    }
}
