name: ${PROJECT_NAME:-wordpress}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  nginx-prod:
    <<: *default-security
    image: ${NGINX_IMAGE:-nginx:1.26-alpine}
    container_name: ${PROJECT_NAME:-wordpress}-nginx-prod
    ports:
      - "${PROD_PORT:-8080}:80"
    volumes:
      - wordpress_prod_data:/var/www/html:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      wordpress-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${NGINX_PROD_CPU_LIMIT:-0.50}"
          memory: ${NGINX_PROD_MEM_LIMIT:-128M}

  nginx-stage:
    <<: *default-security
    image: ${NGINX_IMAGE:-nginx:1.26-alpine}
    container_name: ${PROJECT_NAME:-wordpress}-nginx-stage
    ports:
      - "${STAGE_PORT:-8081}:80"
    volumes:
      - wordpress_stage_data:/var/www/html:ro
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      wordpress-stage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${NGINX_STAGE_CPU_LIMIT:-0.25}"
          memory: ${NGINX_STAGE_MEM_LIMIT:-128M}

  wordpress-prod:
    <<: *default-security
    build:
      context: ./docker/wordpress
      dockerfile: Dockerfile
      args:
        WORDPRESS_IMAGE: ${WORDPRESS_IMAGE:-wordpress:7.1-php8.3-fpm}
    image: ${PROJECT_NAME:-wordpress}-wordpress:${WORDPRESS_TAG:-7.1-php8.3-fpm}
    container_name: ${PROJECT_NAME:-wordpress}-wordpress-prod
    environment:
      TZ: ${TZ:-UTC}
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${PROD_DB_NAME}
      WORDPRESS_DB_USER: ${PROD_DB_USER}
      WORDPRESS_DB_PASSWORD: ${PROD_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_DEBUG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', false);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_MEMORY_LIMIT', getenv('WORDPRESS_MEMORY_LIMIT') ?: '256M');
        define('WP_MAX_MEMORY_LIMIT', getenv('WORDPRESS_MEMORY_LIMIT') ?: '256M');
        define('WP_REDIS_HOST', 'redis-prod');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', getenv('REDIS_PASSWORD') ?: '');
        define('WP_REDIS_PREFIX', 'wp_prod:');
        define('WP_REDIS_DATABASE', 0);
        define('WP_REDIS_TIMEOUT', 1);
        define('WP_REDIS_READ_TIMEOUT', 1);
      WORDPRESS_MEMORY_LIMIT: ${WORDPRESS_PROD_MEMORY_LIMIT:-256M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-64M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-64M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-120}
      REDIS_PASSWORD: ${REDIS_PROD_PASSWORD}
    volumes:
      - wordpress_prod_data:/var/www/html
      - ./docker/wordpress/production/php.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
      - ./docker/wordpress/production/zz-fpm.conf:/usr/local/etc/php-fpm.d/zz-tuning.conf:ro
      - ./custom/plugins:/var/www/html/wp-content/plugins/custom:ro
      - ./custom/themes:/var/www/html/wp-content/themes/custom:ro
    networks:
      - frontend
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${WORDPRESS_PROD_CPU_LIMIT:-2.0}"
          memory: ${WORDPRESS_PROD_MEM_LIMIT:-4G}
        reservations:
          memory: ${WORDPRESS_PROD_MEM_RESERVATION:-1G}

  wordpress-stage:
    <<: *default-security
    build:
      context: ./docker/wordpress
      dockerfile: Dockerfile
      args:
        WORDPRESS_IMAGE: ${WORDPRESS_IMAGE:-wordpress:7.1-php8.3-fpm}
    image: ${PROJECT_NAME:-wordpress}-wordpress:${WORDPRESS_TAG:-7.1-php8.3-fpm}
    container_name: ${PROJECT_NAME:-wordpress}-wordpress-stage
    environment:
      TZ: ${TZ:-UTC}
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${STAGE_DB_NAME}
      WORDPRESS_DB_USER: ${STAGE_DB_USER}
      WORDPRESS_DB_PASSWORD: ${STAGE_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "0"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('WP_DEBUG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        define('DISALLOW_FILE_EDIT', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_MEMORY_LIMIT', getenv('WORDPRESS_MEMORY_LIMIT') ?: '256M');
        define('WP_MAX_MEMORY_LIMIT', getenv('WORDPRESS_MEMORY_LIMIT') ?: '256M');
        define('WP_REDIS_HOST', 'redis-stage');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_PASSWORD', getenv('REDIS_PASSWORD') ?: '');
        define('WP_REDIS_PREFIX', 'wp_stage:');
        define('WP_REDIS_DATABASE', 0);
        define('WP_REDIS_TIMEOUT', 1);
        define('WP_REDIS_READ_TIMEOUT', 1);
      WORDPRESS_MEMORY_LIMIT: ${WORDPRESS_STAGE_MEMORY_LIMIT:-256M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-64M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-64M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-120}
      REDIS_PASSWORD: ${REDIS_STAGE_PASSWORD}
    volumes:
      - wordpress_stage_data:/var/www/html
      - ./docker/wordpress/staging/php.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
      - ./docker/wordpress/staging/zz-fpm.conf:/usr/local/etc/php-fpm.d/zz-tuning.conf:ro
      - ./custom/plugins:/var/www/html/wp-content/plugins/custom:ro
      - ./custom/themes:/var/www/html/wp-content/themes/custom:ro
    networks:
      - frontend
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
      redis-stage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${WORDPRESS_STAGE_CPU_LIMIT:-1.0}"
          memory: ${WORDPRESS_STAGE_MEM_LIMIT:-2G}
        reservations:
          memory: ${WORDPRESS_STAGE_MEM_RESERVATION:-512M}

  mariadb:
    <<: *default-security
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: ${PROJECT_NAME:-wordpress}-mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-512M}
      - --max-connections=${MARIADB_MAX_CONNECTIONS:-150}
      - --skip-name-resolve
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
      PROD_DB_NAME: ${PROD_DB_NAME}
      PROD_DB_USER: ${PROD_DB_USER}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD}
      STAGE_DB_NAME: ${STAGE_DB_NAME}
      STAGE_DB_USER: ${STAGE_DB_USER}
      STAGE_DB_PASSWORD: ${STAGE_DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mariadb/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${MARIADB_CPU_LIMIT:-2.0}"
          memory: ${MARIADB_MEM_LIMIT:-4G}
        reservations:
          memory: ${MARIADB_MEM_RESERVATION:-1G}

  redis-prod:
    <<: *default-security
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: ${PROJECT_NAME:-wordpress}-redis-prod
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PROD_PASSWORD}
      - --maxmemory
      - ${REDIS_PROD_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PROD_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${REDIS_PROD_CPU_LIMIT:-0.50}"
          memory: ${REDIS_PROD_MEM_LIMIT:-1G}
        reservations:
          memory: ${REDIS_PROD_MEM_RESERVATION:-128M}

  redis-stage:
    <<: *default-security
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: ${PROJECT_NAME:-wordpress}-redis-stage
    command:
      - redis-server
      - --requirepass
      - ${REDIS_STAGE_PASSWORD}
      - --maxmemory
      - ${REDIS_STAGE_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_STAGE_PASSWORD}
    volumes:
      - redis_stage_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${REDIS_STAGE_CPU_LIMIT:-0.25}"
          memory: ${REDIS_STAGE_MEM_LIMIT:-512M}
        reservations:
          memory: ${REDIS_STAGE_MEM_RESERVATION:-64M}

networks:
  frontend:
    name: ${PROJECT_NAME:-wordpress}_frontend
  backend:
    name: ${PROJECT_NAME:-wordpress}_backend
    internal: true

volumes:
  mariadb_data:
    name: ${PROJECT_NAME:-wordpress}_mariadb_data
  wordpress_prod_data:
    name: ${PROJECT_NAME:-wordpress}_wordpress_prod_data
  wordpress_stage_data:
    name: ${PROJECT_NAME:-wordpress}_wordpress_stage_data
  redis_prod_data:
    name: ${PROJECT_NAME:-wordpress}_redis_prod_data
  redis_stage_data:
    name: ${PROJECT_NAME:-wordpress}_redis_stage_data
